[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:api-gateway]
command=java -Dserver.port=%(ENV_PORT)s -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -jar /app/api-gateway.jar
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
startsecs=30
stdout_logfile=/var/log/supervisor/api-gateway.log
stderr_logfile=/var/log/supervisor/api-gateway.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:auth-service]
command=java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -jar /app/auth-service.jar
directory=/app
user=appuser
autostart=true
autorestart=true
startretries=3
startsecs=60
stdout_logfile=/var/log/supervisor/auth-service.log
stderr_logfile=/var/log/supervisor/auth-service.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

