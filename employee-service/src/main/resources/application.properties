spring.application.name=employee-service
server.port=${SERVER_PORT:8084}

spring.mandatory-file-encoding=UTF-8
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hr_platform}?currentSchema=employee_schema&stringtype=unspecified&sslmode=disable
spring.datasource.username=${POSTGRES_USER:hr_admin}
spring.datasource.password=${POSTGRES_PASSWORD:hr_secret_2025}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=employee_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=employee_schema
spring.liquibase.liquibase-schema=employee_schema

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis_secret_2025}
spring.data.redis.timeout=5000ms

spring.session.store-type=redis
spring.session.data.redis.namespace=hr:employee:sessions
spring.session.timeout=30m

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=employee-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topics.application-submitted=application.submitted
app.kafka.topics.application-updated=application.updated
app.kafka.topics.document-signed=document.signed
app.kafka.topics.candidate-promoted=candidate.promoted
app.kafka.topics.attendance-ingested=attendance.ingested.v1
app.kafka.topics.activity-log=activity.log

app.attendance.ingestion.api-key=${ATTENDANCE_INGESTION_API_KEY:attendance_ingestion_dev_key}
app.payroll.tax.opv-rate=${PAYROLL_TAX_OPV_RATE:0.10}
app.payroll.tax.osms-rate=${PAYROLL_TAX_OSMS_RATE:0.02}
app.payroll.tax.iit-rate=${PAYROLL_TAX_IIT_RATE:0.10}
app.payroll.sick-leave-paid-rate=${PAYROLL_SICK_LEAVE_PAID_RATE:0.80}
app.payroll.timesheet.template-path=${PAYROLL_TIMESHEET_TEMPLATE_PATH:docs-templates/Mart-tabel-ucheta-rabochego-vremeni.docx}

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000
spring.cloud.openfeign.client.config.default.logger-level=BASIC

app.feign.auth-service-url=http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
app.feign.candidate-service-url=http://${CANDIDATE_SERVICE_HOST:localhost}:${CANDIDATE_SERVICE_PORT:8082}
app.feign.document-service-url=http://${DOCUMENT_SERVICE_HOST:localhost}:${DOCUMENT_SERVICE_PORT:8083}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001,http://localhost:4200,http://localhost:8000,http://localhost:4000}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.redis.enabled=true

springdoc.api-docs.path=/api/v1/employees/api-docs
springdoc.swagger-ui.path=/api/v1/employees/swagger-ui.html

logging.level.root=INFO
logging.level.kz.whosnext.hr=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.cloud.openfeign=DEBUG
