services:

  postgres:
    image: postgres:16-alpine
    container_name: hr-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hr_platform}
      POSTGRES_USER: ${POSTGRES_USER:-hr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_secret_2025}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hr_admin} -d ${POSTGRES_DB:-hr_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hr-network

  redis:
    image: redis:7-alpine
    container_name: hr-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_2025} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hr-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: hr-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Zookeeper"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hr-network

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: hr-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - hr-network

  minio:
    image: minio/minio:latest
    container_name: hr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret_2025}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - hr-network

  ncanode:
    image: malikzh/ncanode
    container_name: hr-ncanode
    restart: unless-stopped
    ports:
      - "14579:14579"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:14579/ || curl -sf http://localhost:14579/actuator/health || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - hr-network

  minio-init:
    image: minio/mc:latest
    container_name: hr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/hr-documents;
      mc mb --ignore-existing local/hr-templates;
      mc mb --ignore-existing local/hr-uploads;
      mc mb --ignore-existing local/hr-avatars;
      mc anonymous set download local/hr-documents;
      mc anonymous set download local/hr-avatars;
      echo 'Buckets created successfully';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_secret_2025}
    networks:
      - hr-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: hr-api-gateway
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_2025}
      JWT_SECRET: ${JWT_SECRET:-YTJiM2M0ZDVlNmY3ZzhoOWkwajFrMmwzbTRuNW82cDdxOHI5czB0MXUydjN3NHg1eTZ6N0E4QjlDMEQxRTJG}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3001}
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 8081
      CANDIDATE_SERVICE_HOST: candidate-service
      CANDIDATE_SERVICE_PORT: 8082
      DOCUMENT_SERVICE_HOST: document-service
      DOCUMENT_SERVICE_PORT: 8083
      EMPLOYEE_SERVICE_HOST: employee-service
      EMPLOYEE_SERVICE_PORT: 8084
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - hr-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: hr-auth-service
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: 8081
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hr_platform}
      POSTGRES_USER: ${POSTGRES_USER:-hr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_secret_2025}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_2025}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-YTJiM2M0ZDVlNmY3ZzhoOWkwajFrMmwzbTRuNW82cDdxOHI5czB0MXUydjN3NHg1eTZ6N0E4QjlDMEQxRTJG}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-hr-platform@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-mail_app_password}
      APP_BASE_URL: "http://10.1.18.32:8102"
      FRONTEND_URL: "http://10.1.18.32:5173"
      OAUTH2_REDIRECT_URL: ${OAUTH2_REDIRECT_URL:-http://localhost:3000/oauth2/callback}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_secret_2025}
      EMAIL_VERIFICATION_ENABLED: "true"
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8"
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - hr-network

  candidate-service:
    build:
      context: .
      dockerfile: candidate-service/Dockerfile
    container_name: hr-candidate-service
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hr_platform}
      POSTGRES_USER: ${POSTGRES_USER:-hr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_secret_2025}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_2025}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 8081
      DOCUMENT_SERVICE_HOST: document-service
      DOCUMENT_SERVICE_PORT: 8083
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-hr-platform@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-mail_app_password}
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8"
    ports:
      - "${CANDIDATE_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - hr-network

  document-service:
    build:
      context: .
      dockerfile: document-service/Dockerfile
    container_name: hr-document-service
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hr_platform}
      POSTGRES_USER: ${POSTGRES_USER:-hr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_secret_2025}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 8081
      CANDIDATE_SERVICE_HOST: candidate-service
      CANDIDATE_SERVICE_PORT: 8082
      EMPLOYEE_SERVICE_HOST: employee-service
      EMPLOYEE_SERVICE_PORT: 8084
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin_secret_2025}
      MINIO_BUCKET: ${MINIO_BUCKET:-hr-documents}
      NCANODE_URL: http://ncanode:14579
      ECP_COMPANY_KEY_PATH: /opt/keys/company.p12
      ECP_COMPANY_KEY_PASSWORD: ${ECP_COMPANY_KEY_PASSWORD:-Preussen1871!}
      COMPANY_BIN: ${COMPANY_BIN:-990140000001}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8"
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8083}:8083"
    volumes:
      - ./keys:/opt/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ncanode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - hr-network

  employee-service:
    build:
      context: .
      dockerfile: employee-service/Dockerfile
    container_name: hr-employee-service
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_PORT: 8084
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hr_platform}
      POSTGRES_USER: ${POSTGRES_USER:-hr_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hr_secret_2025}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_2025}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 8081
      DOCUMENT_SERVICE_HOST: document-service
      DOCUMENT_SERVICE_PORT: 8083
      ATTENDANCE_INGESTION_API_KEY: ${ATTENDANCE_INGESTION_API_KEY:-attendance_ingestion_dev_key}
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8"
    ports:
      - "${EMPLOYEE_SERVICE_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - hr-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local

networks:
  hr-network:
    driver: bridge

