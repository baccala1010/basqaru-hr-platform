spring.application.name=document-service
server.port=${SERVER_PORT:8083}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
# Windows dev path ? override via PDF_CYRILLIC_FONT_PATH env var in Docker/Linux

spring.mandatory-file-encoding=UTF-8
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hr_platform}?currentSchema=document_schema&stringtype=unspecified&sslmode=disable
spring.datasource.username=${POSTGRES_USER:hr_admin}
spring.datasource.password=${POSTGRES_PASSWORD:hr_secret_2025}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=document_schema
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=document_schema
spring.liquibase.liquibase-schema=document_schema

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=document-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.dlt.suffix=.dlt
app.kafka.consumer.retry.backoff-ms=2000
app.kafka.consumer.retry.max-attempts=5

app.kafka.topics.application-approved=application.approved
app.kafka.topics.document-generated=document.generated
app.kafka.topics.document-signed=document.signed
app.kafka.topics.activity-log=activity.log

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000
spring.cloud.openfeign.client.config.default.logger-level=BASIC

app.feign.auth-service-url=http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
app.feign.candidate-service-url=http://${CANDIDATE_SERVICE_HOST:localhost}:${CANDIDATE_SERVICE_PORT:8082}
app.feign.employee-service-url=http://${EMPLOYEE_SERVICE_HOST:localhost}:${EMPLOYEE_SERVICE_PORT:8084}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001,http://localhost:4200,http://localhost:8000,http://localhost:4000}

app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin_secret_2025}
app.minio.bucket=${MINIO_BUCKET:hr-documents}

app.ncanode.url=${NCANODE_URL:http://localhost:14579}
app.ncanode.connect-timeout=5000
app.ncanode.read-timeout=30000

app.ecp.company-key-path=${ECP_COMPANY_KEY_PATH:/opt/keys/company.p12}
app.ecp.company-key-password=${ECP_COMPANY_KEY_PASSWORD:Preussen1871!}
# Set to true in dev/demo environments where ??? ?? test certificates are used
app.ecp.skip-candidate-verify=${ECP_SKIP_CANDIDATE_VERIFY:true}
app.company.bin=${COMPANY_BIN:240340027815}
app.company.name=${COMPANY_NAME:\u0422\u041E\u041E \u00AB\u0410\u043B\u0444\u0430\u0422\u0435\u0445\u00BB}
app.company.director.name=${COMPANY_DIRECTOR_NAME:\u0421\u0435\u0439\u0442\u043A\u0430\u043B\u0438 \u0415\u0440\u043C\u0435\u043A \u0411\u043E\u043B\u0430\u0442\u043E\u0432\u0438\u0447}
app.company.director.iin=${COMPANY_DIRECTOR_IIN:850101300123}
app.company.city=${COMPANY_CITY:\u0433. \u0410\u0441\u0442\u0430\u043D\u0430}

app.pdf.cyrillic-font-path=${PDF_CYRILLIC_FONT_PATH:C:/Windows/Fonts/arial.ttf}

app.base-url=${APP_BASE_URL:https://hr.yourcompany.kz}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

springdoc.api-docs.path=/api/v1/documents/api-docs
springdoc.swagger-ui.path=/api/v1/documents/swagger-ui.html

logging.level.root=INFO
logging.level.kz.whosnext.hr=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.io.minio=INFO
